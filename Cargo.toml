[package]
name = "mocktide"
version = "0.1.0"
edition = "2021"
authors = ["Cauã Bernardino <cauabernardino@outlook.com>"]
license = "MIT"
readme = "README.md"
description = "A configurable mock server for testing network clients."
repository = "https://github.com/cauabernardino/mocktide"
keywords = ["mock", "protocols", "tcp", "udp"]

[lib]
path = "src/lib.rs"

[[bin]]
path = "src/main.rs"
name = "mocktide"

[dependencies]
tokio = { version = "1.54", features = ["full"] }
log = "0.4.35"
env_logger = "0.11.12"
anyhow = "1.0.105"
bytes = "1.12"
serde = { version = "1.0.229", features = ["derive"] }
clap = { version = "4.6", features = ["derive"] }
junit-report = "0.9"
tokio-util = { version = "0.7.20", features = ["rt"] }
serde_yaml_ng = "0.10"
quick-xml = "0.41"

[dev-dependencies]
tempfile = "3.27"
claims = "0.8"

[profile.release]
strip = true
opt-level = "s"
lto = true

